---
layout: default
---
<h1>{{ page.title }}</h1>
{{ content }}
<ul class="piece-list">
  {% assign items = site[page.collection] | sort: "date" | reverse %}
  {% for item in items %}
  <li>
    <a href="{{ item.url }}">{{ item.title }}</a>
    {% if item.date %}<span class="date">{{ item.date | date: "%Y" }}</span>{% endif %}
  </li>
  {% endfor %}
</ul>
